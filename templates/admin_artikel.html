    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Artikel - Bell's Palsy</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Google Font -->
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

        <style>
            body {
                background: #f4f6f9;
                font-family: 'Poppins', sans-serif;
            }

            .navbar {
                background: linear-gradient(135deg, #4facfe, #00f2fe);
            }

            .navbar-brand {
                font-weight: 600;
            }

            .card {
                border: none;
                border-radius: 18px;
                box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            }

            .form-control, .form-select {
                border-radius: 10px;
                padding: 10px;
            }

            .form-control:focus {
                box-shadow: 0 0 0 2px rgba(79,172,254,0.2);
                border-color: #4facfe;
            }

            .btn-primary {
                background: linear-gradient(135deg, #4facfe, #00f2fe);
                border: none;
                border-radius: 12px;
                padding: 10px;
                font-weight: 500;
                transition: 0.3s;
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            }

            .btn-outline-danger {
                border-radius: 8px;
            }

            .table {
                border-radius: 12px;
                overflow: hidden;
            }

            .table-hover tbody tr:hover {
                background-color: #f1f9ff;
                transition: 0.2s;
            }

            .badge {
                padding: 6px 10px;
                border-radius: 8px;
                font-weight: 500;
            }

            .section-title {
                font-weight: 600;
                margin-bottom: 15px;
            }
        </style>
    </head>

    <body>

   <nav class="navbar navbar-dark mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand">🧠 Admin Dashboard - Bell's Palsy</span>

        <a href="{{ url_for('admin_logout') }}" 
           class="btn btn-light btn-sm"
           onclick="return confirm('Yakin ingin logout?')">
            Logout
        </a>
    </div>
</nav>

    <div class="container">
        <div class="row g-4">

            <!-- FORM -->
            <div class="col-md-5">
                <div class="card p-4">
                    <h5 class="section-title">Tambah Artikel</h5>

                    <form action="/admin/articles" method="POST" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">Judul</label>
                            <input type="text" name="title" class="form-control" placeholder="Masukkan judul..." required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Kategori</label>
                            <select name="category" class="form-select">
                                <option value="Edukasi">Edukasi</option>
                                <option value="Terapi">Terapi</option>
                                <option value="Nutrisi">Nutrisi</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Gambar</label>
                            <input type="file" name="image" class="form-control" accept="image/*" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Konten</label>
                            <textarea name="content" class="form-control" rows="5" placeholder="Tulis isi artikel..." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nama Sumber</label>
                            <input type="text"
                                name="source_name"
                                class="form-control"
                                placeholder="Contoh: Mayo Clinic">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Link Sumber</label>
                            <input type="url"
                                name="source_url"
                                class="form-control"
                                placeholder="https://www.mayoclinic.org">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            🚀 Publikasikan
                        </button>

                    </form>
                </div>
            </div>

            <!-- TABLE -->
            <div class="col-md-7">
                <div class="card p-4">
                    <h5 class="section-title">Daftar Artikel</h5>

                    <div class="table-responsive">
                        <table class="table align-middle table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Judul</th>
                                    <th>Kategori</th>
                                    
                                    <th style="width: 100px;">Aksi</th>
                                </tr>
                            </thead>

                            <tbody>
                                {% for art in articles %}
                                <tr>
                                    <td><strong>{{ art.title }}</strong></td>

                                    <td>
                                        <span class="badge bg-info text-dark">
                                            {{ art.category }}
                                        </span>
                                    </td>

                                    <td>
                                        <a href="/admin/articles/edit/{{ art.id }}"
                                        class="btn btn-sm btn-warning">
                                        ✏️
                                        </a>

                                        <a href="/admin/articles/delete/{{ art.id }}"
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Yakin hapus artikel ini?')">
                                        🗑
                                        </a>
                                    </td>
                                    
                                </tr>
                                {% else %}
                                <tr>
                                    <td colspan="3" class="text-center text-muted">
                                        Belum ada artikel 😢
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>

                        </table>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    </body>
    </html>
