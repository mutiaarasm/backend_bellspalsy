<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Artikel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
            font-family:'Poppins',sans-serif;
        }

        .navbar{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .card{
            border:none;
            border-radius:20px;
            box-shadow:0 8px 25px rgba(0,0,0,.08);
        }

        .form-control,
        .form-select{
            border-radius:12px;
            padding:12px;
        }

        .form-control:focus,
        .form-select:focus{
            border-color:#4facfe;
            box-shadow:0 0 0 3px rgba(79,172,254,.15);
        }

        .btn-update{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            border:none;
            border-radius:12px;
            color:white;
            font-weight:600;
            padding:12px;
        }

        .btn-update:hover{
            opacity:.9;
            color:white;
        }

        .preview-image{
            width:100%;
            max-height:300px;
            object-fit:cover;
            border-radius:15px;
            border:1px solid #ddd;
        }

        .section-title{
            font-weight:600;
        }

        label{
            font-weight:500;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand">
            ✏️ Edit Artikel Bell's Palsy
        </span>
    </div>
</nav>

<div class="container mt-4 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card p-4">

                <h3 class="section-title mb-4">
                    Edit Artikel
                </h3>

                <form method="POST"
                      enctype="multipart/form-data">

                    <!-- Judul -->
                    <div class="mb-3">
                        <label class="form-label">
                            Judul Artikel
                        </label>

                        <input type="text"
                               name="title"
                               class="form-control"
                               value="{{ article.title }}"
                               required>
                    </div>

                    <!-- Kategori -->
                    <div class="mb-3">
                        <label class="form-label">
                            Kategori
                        </label>

                        <select name="category"
                                class="form-select">

                            <option value="Edukasi"
                            {% if article.category == 'Edukasi' %}selected{% endif %}>
                                Edukasi
                            </option>

                            <option value="Gejala"
                            {% if article.category == 'Gejala' %}selected{% endif %}>
                                Gejala
                            </option>

                            <option value="Terapi"
                            {% if article.category == 'Terapi' %}selected{% endif %}>
                                Terapi
                            </option>

                            <option value="Latihan Wajah"
                            {% if article.category == 'Latihan Wajah' %}selected{% endif %}>
                                Latihan Wajah
                            </option>

                            <option value="Nutrisi"
                            {% if article.category == 'Nutrisi' %}selected{% endif %}>
                                Nutrisi
                            </option>

                            <option value="Pemulihan"
                            {% if article.category == 'Pemulihan' %}selected{% endif %}>
                                Pemulihan
                            </option>

                        </select>
                    </div>

                    <!-- Preview Gambar -->
                    {% if article.image_url %}
                    <div class="mb-3">
                        <label class="form-label">
                            Gambar Saat Ini
                        </label>

                        <img src="/static/uploads/{{ article.image_url }}"
                             class="preview-image mt-2">
                    </div>
                    {% endif %}

                    <!-- Upload Gambar -->
                    <div class="mb-3">
                        <label class="form-label">
                            Ganti Gambar (Opsional)
                        </label>

                        <input type="file"
                               name="image"
                               class="form-control"
                               accept="image/*">
                    </div>

                    <!-- Nama Sumber -->
                    <div class="mb-3">
                        <label class="form-label">
                            Nama Sumber
                        </label>

                        <input type="text"
                               name="source_name"
                               class="form-control"
                               value="{{ article.source_name or '' }}"
                               placeholder="Contoh: Mayo Clinic">
                    </div>

                    <!-- Link Sumber -->
                    <div class="mb-3">
                        <label class="form-label">
                            Link Sumber
                        </label>

                        <input type="url"
                               name="source_url"
                               class="form-control"
                               value="{{ article.source_url or '' }}"
                               placeholder="https://www.mayoclinic.org">
                    </div>

                    <!-- Konten -->
                    <div class="mb-4">
                        <label class="form-label">
                            Konten Artikel
                        </label>

                        <textarea name="content"
                                  rows="10"
                                  class="form-control"
                                  required>{{ article.content }}</textarea>
                    </div>

                    <!-- Tombol -->
                    <div class="d-flex gap-2">

                        <button type="submit"
                                class="btn btn-update flex-fill">
                            💾 Simpan Perubahan
                        </button>

                        <a href="/admin/articles"
                           class="btn btn-secondary">
                            Batal
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
